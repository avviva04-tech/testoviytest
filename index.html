<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система логістичного контролю</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #d1d5db;
    text-align: center;
}

.screen {
    display: none;
    padding: 40px 20px;
}

.active {
    display: block;
}

input {
    padding: 10px;
    margin: 10px;
    width: 250px;
    background: #111827;
    border: 1px solid #374151;
    color: white;
}

button {
    padding: 12px 20px;
    margin-top: 15px;
    background: #1f2937;
    border: 1px solid #4b5563;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #374151;
}

.timer {
    margin: 15px;
    font-weight: bold;
}

.progress {
    height: 6px;
    background: #1f2937;
    margin: 15px 0;
}

.bar {
    height: 6px;
    width: 0%;
    background: #22c55e;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="intro" class="screen active">
    <h1>Система логістичного контролю</h1>
    <p>Перевірка доступу...</p>
    <button onclick="showForm()">Продовжити</button>
</div>

<!-- SCREEN 2 -->
<div id="form" class="screen">
    <h2>Анкетування</h2>
    <input id="name" placeholder="ПІБ">
    <br>
    <input id="group" placeholder="Група / Підрозділ">
    <br>
    <button onclick="startTest()">Почати тестування</button>
</div>

<!-- SCREEN 3 -->
<div id="test" class="screen">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="timer">Час: <span id="time">15</span></div>
    <h3 id="question"></h3>
    <div id="answers"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen"></div>

<script>

const BOT_TOKEN = "ВСТАВ_СЮДА_СВІЙ_TOKEN";
const CHAT_ID = "ВСТАВ_СЮДА_CHAT_ID";

let attempts = localStorage.getItem("attempts") || 0;
let current = 0;
let score = 0;
let timer;
let timeLeft = 15;
let startTime;
let userName = "";
let userGroup = "";

const questions = [
{
question: "Військове майно це:",
answers: {
A: "Державне майно, закріплене за військовими частинами",
B: "Приватне майно",
C: "Будь-яке майно МОУ",
D: "Тільки зброя"
},
correct: "A"
},
{
question: "Коли майно набуває статусу військового?",
answers: {
A: "Після надходження",
B: "Після реєстрації",
C: "Після надходження і закріплення",
D: "Після складування"
},
correct: "C"
}
];

if (attempts >= 3) {
document.body.innerHTML = "<h1>Доступ заблоковано</h1>";
}

function showForm() {
document.getElementById("intro").classList.remove("active");
document.getElementById("form").classList.add("active");
}

function startTest() {
userName = document.getElementById("name").value;
userGroup = document.getElementById("group").value;

if (!userName || !userGroup) {
alert("Заповніть анкету");
return;
}

startTime = Date.now();

document.getElementById("form").classList.remove("active");
document.getElementById("test").classList.add("active");

loadQuestion();
}

function startTimer() {
timeLeft = 15;
document.getElementById("time").innerText = timeLeft;

timer = setInterval(() => {
timeLeft--;
document.getElementById("time").innerText = timeLeft;
if (timeLeft <= 0) {
clearInterval(timer);
next();
}
}, 1000);
}

function loadQuestion() {
if (current >= questions.length) {
finishTest("Завершено");
return;
}

startTimer();

let q = questions[current];
document.getElementById("question").innerText = q.question;

let answersDiv = document.getElementById("answers");
answersDiv.innerHTML = "";

for (let key in q.answers) {
let btn = document.createElement("button");
btn.innerText = key + ") " + q.answers[key];
btn.onclick = () => checkAnswer(key);
answersDiv.appendChild(btn);
}

document.getElementById("bar").style.width =
(current / questions.length) * 100 + "%";
}

function checkAnswer(ans) {
clearInterval(timer);
if (ans === questions[current].correct) score++;
next();
}

function next() {
current++;
loadQuestion();
}

function finishTest(status) {

let duration = Math.floor((Date.now() - startTime)/1000);

localStorage.setItem("attempts", ++attempts);

sendToTelegram(status, duration);

document.getElementById("test").classList.remove("active");
document.getElementById("result").classList.add("active");

document.getElementById("result").innerHTML = `
<h1>Результат</h1>
<p>${score} / ${questions.length}</p>
<p>${status}</p>
<button onclick="location.reload()">Вийти</button>
`;
}

function sendToTelegram(status, duration) {

let text = `
📋 Новий тест
👤 ПІБ: ${userName}
🏫 Група: ${userGroup}
📊 Результат: ${score}/${questions.length}
⏱ Час: ${duration} сек
📌 Статус: ${status}
`;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify({
chat_id: CHAT_ID,
text: text
})
});
}

window.addEventListener("beforeunload", function (e) {
if (current > 0 && current < questions.length) {
finishTest("Спроба перервана");
}
});

</script>
</body>
</html>
